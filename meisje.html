<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoera, toch een meisje!</title>
    <meta name="description" content="Plotwending: het is tóch een meisje." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="girl-page">
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="glitter" aria-hidden="true"></div>

    <div class="bows" aria-hidden="true">
      <span class="bow b-1">🎀</span>
      <span class="bow b-2">🎀</span>
      <span class="bow b-3">🎀</span>
      <span class="bow b-4">🎀</span>
      <span class="bow b-5">🎀</span>
      <span class="bow b-6">🎀</span>
    </div>

    <div class="balloons" aria-hidden="true">
      <div class="balloon pink"><span class="string"></span></div>
      <div class="balloon blush"><span class="string"></span></div>
      <div class="balloon white"><span class="string"></span></div>
      <div class="balloon gold"><span class="string"></span></div>
      <div class="balloon hot"><span class="string"></span></div>
      <div class="balloon pink late"><span class="string"></span></div>
    </div>

    <main class="girl-card">
      <p class="girl-kicker">Plotwending · strikjes · glitter</p>
      <p class="girl-emoji" aria-hidden="true">💗 🎀 ✨</p>
      <h1>Hoera, toch een meisje!</h1>
      <p class="girl-lead">
        De mini-Jedi mag even wachten. Dit sterrenstelsel kleurt
        <em>roze</em> — en de feestjes worden nóg groter.
      </p>
      <p class="girl-lead">Welkom, kleine prinses. De wereld wordt zachter, glitteriger, en een stukje voller van liefde.</p>
      <a class="back-galaxy" href="index.html">Terug naar de crawl</a>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
